<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stickman Parallax Zoom</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Stick man at his desk, 3 s. Layered scene with a slow parallax push-in.
// Each layer sits at a depth D; the camera travels forward by cam.c, so a
// layer scales by D / (D - c): near layers grow faster than far ones.
const W = 1920, H = 1080, C = { x: W / 2, y: H / 2 }, DUR = 3, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const INK = '#18120e';
const PI = Math.PI, rad = d => d * PI / 180;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeIO = t => 0.5 - 0.5 * Math.cos(PI * clamp(t));

let MOUTH = [];
window.setMouth = a => { MOUTH = a; };
function mouthAt(t) {
  if (!MOUTH.length) return 0;
  const f = clamp(t * FPS, 0, MOUTH.length - 1), i = Math.floor(f);
  return lerp(MOUTH[i], MOUTH[Math.min(i + 1, MOUTH.length - 1)], f - i);
}

function rng(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

// ---------------------------------------------------------------- camera
const DEPTH = { wall: 10, back: 7, char: 5, front: 4.3, dust: 3.2 };
const HEAD = { x: 1437, y: 360 };
function camera(t) {
  const u = t / DUR;
  const e = 0.3 * u + 0.7 * easeIO(u);        // moving from frame 1, gently
  const c = 0.8 * e;
  const sEnd = DEPTH.char / (DEPTH.char - 0.8);
  const target = { x: 1320, y: 392 };         // where the head lands at the end
  const L = {
    x: (HEAD.x - C.x - (target.x - C.x) / sEnd) * e,
    y: (HEAD.y - C.y - (target.y - C.y) / sEnd) * e,
  };
  return { c, L };
}
function layerXf(cam, d) {
  const s = d / (d - cam.c), k = DEPTH.char / d;
  return { s, tx: C.x - s * C.x - cam.L.x * s * k, ty: C.y - s * C.y - cam.L.y * s * k };
}
function useLayer(cam, d) {
  const x = layerXf(cam, d);
  ctx.setTransform(x.s, 0, 0, x.s, x.tx, x.ty);
  return x;
}
const project = (x, p) => ({ x: p.x * x.s + x.tx, y: p.y * x.s + x.ty });

// ---------------------------------------------------------------- helpers
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function poly(pts, smoothCorners) {
  ctx.beginPath();
  if (!smoothCorners) {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]);
  } else {
    const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const m0 = mid(pts[n - 1], pts[0]);
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const m = mid(pts[i], pts[(i + 1) % n]);
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]);
    }
  }
  ctx.closePath();
}
function fillStroke(fill, lw = 6, stroke = INK) {
  ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function sparkle(x, y, r, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fffbe6';
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r * 0.9, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r * 0.9, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.6);
  g.addColorStop(0, 'rgba(255,230,150,0.55)'); g.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 2 * PI); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- far layer: wall, shelves, window, floor
const BOOK_COLORS = ['#3d6b53', '#2e5877', '#973c2e', '#c47f3c', '#4e8688', '#7b5331',
  '#d8c59b', '#5a6e33', '#a8552f', '#3a4f6e', '#b8913f', '#6d3d52'];
const DIVIDERS = [-420, -150, 133, 370, 607, 851, 1102, 1339, 1600];
const SHELF_TOP = -160, SHELF_BOTTOM = 430, ROW = 74, FLOOR_Y = 655;

function drawWall() {
  ctx.fillStyle = '#3b2313';
  ctx.fillRect(-600, -400, 2300, FLOOR_Y + 400);
  const r = rng(7);
  // books, row by row inside each unit
  for (let u = 0; u < DIVIDERS.length - 1; u++) {
    const x0 = DIVIDERS[u] + 14, x1 = DIVIDERS[u + 1] - 14;
    for (let yb = SHELF_TOP + ROW; yb <= SHELF_BOTTOM; yb += ROW) {
      ctx.fillStyle = '#2a180c';
      ctx.fillRect(x0, yb - ROW, x1 - x0, ROW);
      let x = x0 + 4 + r() * 8;
      while (x < x1 - 12) {
        const kind = r();
        if (kind < 0.07) { x += 18 + r() * 30; continue; }           // gap
        if (kind < 0.13 && x < x1 - 70) {                             // lying stack
          let y = yb;
          const n = 2 + Math.floor(r() * 3);
          for (let i = 0; i < n; i++) {
            const h = 9 + r() * 5, w = 52 + r() * 16;
            ctx.beginPath(); ctx.rect(x, y - h, w, h);
            fillStroke(BOOK_COLORS[Math.floor(r() * BOOK_COLORS.length)], 2);
            y -= h;
          }
          x += 74; continue;
        }
        const w = 13 + r() * 16, h = ROW - 16 - r() * 20;
        if (x + w > x1 - 2) break;
        const col = BOOK_COLORS[Math.floor(r() * BOOK_COLORS.length)];
        ctx.beginPath(); ctx.rect(x, yb - h, w, h);
        fillStroke(col, 2);
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        ctx.fillRect(x + 2, yb - h + 2, w * 0.28, h - 4);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x + 1, yb - h + 8, w - 2, 3);
        ctx.fillRect(x + 1, yb - 12, w - 2, 3);
        x += w + (r() < 0.2 ? 2 : 0);
      }
      // shelf board
      ctx.beginPath(); ctx.rect(x0 - 6, yb - 2, x1 - x0 + 12, 12);
      fillStroke('#94602f', 2);
      ctx.fillStyle = '#b77a3f'; ctx.fillRect(x0 - 6, yb - 2, x1 - x0 + 12, 3);
    }
    // cabinet doors
    const cy = SHELF_BOTTOM + 10, ch = FLOOR_Y - cy - 12, mid = (x0 + x1) / 2;
    for (const [dx, dw] of [[x0, mid - x0 - 3], [mid + 3, x1 - mid - 3]]) {
      ctx.beginPath(); ctx.rect(dx, cy, dw, ch); fillStroke('#8a5629', 3);
      ctx.beginPath(); ctx.rect(dx + 16, cy + 18, dw - 32, ch - 36); fillStroke('#7a4a22', 2.5);
      ctx.fillStyle = 'rgba(255,220,160,0.12)'; ctx.fillRect(dx + 16, cy + 18, dw - 32, 8);
    }
    ctx.beginPath(); ctx.arc(mid - 14, cy + ch / 2, 6, 0, 2 * PI); fillStroke('#d7a84c', 2);
    ctx.beginPath(); ctx.arc(mid + 14, cy + ch / 2, 6, 0, 2 * PI); fillStroke('#d7a84c', 2);
  }
  // vertical frames
  for (const d of DIVIDERS) {
    ctx.beginPath(); ctx.rect(d - 16, -400, 32, FLOOR_Y + 400); fillStroke('#9a6232', 3);
    ctx.fillStyle = '#b9804a'; ctx.fillRect(d - 12, -400, 7, FLOOR_Y + 400);
  }
  // crown / base moulding
  ctx.beginPath(); ctx.rect(-600, FLOOR_Y - 14, 2230, 16); fillStroke('#6e421f', 3);

  // warm light falloff across the wall (bright near the window)
  const g = ctx.createLinearGradient(-400, 0, 1650, 0);
  g.addColorStop(0, 'rgba(20,8,0,0.45)'); g.addColorStop(0.55, 'rgba(20,8,0,0.08)');
  g.addColorStop(1, 'rgba(255,200,120,0.12)');
  ctx.fillStyle = g; ctx.fillRect(-600, -400, 2230, FLOOR_Y + 400);

  drawWindow();
  drawFloor();
}

function drawWindow() {
  const x0 = 1616;
  const sky = ctx.createLinearGradient(0, -300, 0, 760);
  sky.addColorStop(0, '#f5e7c4'); sky.addColorStop(0.6, '#f9eed6'); sky.addColorStop(1, '#dfe7e4');
  ctx.fillStyle = sky; ctx.fillRect(x0, -400, 900, 1200);
  const r = rng(11);
  // distant skyline then nearer towers
  for (const [col, base, hmin, hmax, win] of [['#c9d6db', 520, 180, 420, '#dbe5e8'], ['#9fb3bf', 760, 260, 700, '#c3d2da']]) {
    let x = x0 - 20;
    while (x < x0 + 900) {
      const w = 60 + r() * 90, h = hmin + r() * (hmax - hmin), top = base - h;
      ctx.fillStyle = col; ctx.fillRect(x, top, w, h + 400);
      ctx.strokeStyle = 'rgba(60,80,95,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(x, top, w, h + 400);
      ctx.fillStyle = win;
      for (let wy = top + 14; wy < base + 300; wy += 22)
        for (let wx = x + 10; wx < x + w - 12; wx += 16) ctx.fillRect(wx, wy, 8, 12);
      x += w + 8 + r() * 20;
    }
  }
  // haze
  const hz = ctx.createLinearGradient(x0, 0, x0 + 500, 0);
  hz.addColorStop(0, 'rgba(255,236,190,0.75)'); hz.addColorStop(1, 'rgba(255,236,190,0.1)');
  ctx.fillStyle = hz; ctx.fillRect(x0, -400, 900, 1200);
  // mullions
  ctx.fillStyle = '#e8dcc4';
  ctx.fillRect(1880, -400, 18, 1100);
  ctx.fillRect(x0, 180, 900, 14);
  // frame + sheer curtain
  ctx.beginPath(); ctx.rect(x0 - 10, -400, 28, 1060); fillStroke('#caa06a', 3);
  const cur = ctx.createLinearGradient(1560, 0, 1700, 0);
  cur.addColorStop(0, 'rgba(250,232,196,0.05)'); cur.addColorStop(0.5, 'rgba(250,232,196,0.9)');
  cur.addColorStop(1, 'rgba(250,232,196,0.25)');
  ctx.fillStyle = cur; ctx.fillRect(1560, -400, 150, 1060);
  ctx.strokeStyle = 'rgba(200,160,110,0.35)'; ctx.lineWidth = 3;
  for (const fx of [1590, 1618, 1650, 1678]) {
    ctx.beginPath(); ctx.moveTo(fx, -400); ctx.bezierCurveTo(fx + 8, 100, fx - 8, 400, fx + 4, 660); ctx.stroke();
  }
}

function drawFloor() {
  const g = ctx.createLinearGradient(0, FLOOR_Y, 0, 1000);
  g.addColorStop(0, '#8e5327'); g.addColorStop(1, '#a8672f');
  ctx.fillStyle = g; ctx.fillRect(-600, FLOOR_Y, 2800, 600);
  ctx.strokeStyle = 'rgba(60,30,10,0.45)'; ctx.lineWidth = 2;
  for (let y = FLOOR_Y + 18, k = 0; y < 1100; y += 18 + k * 4, k++) {
    ctx.beginPath(); ctx.moveTo(-600, y); ctx.lineTo(2200, y); ctx.stroke();
  }
  // sunlight pool from the window
  const sp = ctx.createRadialGradient(1500, 760, 20, 1500, 760, 700);
  sp.addColorStop(0, 'rgba(255,214,140,0.45)'); sp.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = sp; ctx.fillRect(700, FLOOR_Y, 1600, 500);
  // rug
  ctx.beginPath();
  ctx.moveTo(230, 700); ctx.lineTo(1150, 690); ctx.lineTo(1260, 900); ctx.lineTo(90, 915); ctx.closePath();
  fillStroke('#eee3cf', 4, '#b9a888');
  ctx.strokeStyle = 'rgba(170,140,100,0.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(265, 718); ctx.lineTo(1130, 708); ctx.lineTo(1225, 885); ctx.lineTo(128, 897); ctx.closePath(); ctx.stroke();
}

// ---------------------------------------------------------------- mid layer: side table and golden globe
function drawBackDesk(t) {
  ctx.beginPath(); roundRect(250, 792, 880, 30, 8); fillStroke('#744524', 5);
  ctx.fillStyle = '#9a6234'; ctx.fillRect(262, 796, 856, 7);
  ctx.beginPath(); ctx.rect(262, 820, 856, 120); fillStroke('#4d2c15', 5);
  // globe stand
  const gx = 460, gy = 640, R = 104;
  ctx.beginPath(); ctx.ellipse(gx, 788, 78, 16, 0, 0, 2 * PI); fillStroke('#c8912e', 5);
  ctx.beginPath(); ctx.rect(gx - 9, 745, 18, 44); fillStroke('#d9a23a', 5);
  ctx.beginPath(); ctx.ellipse(gx, 748, 34, 10, 0, 0, 2 * PI); fillStroke('#d9a23a', 5);
  // meridian ring
  ctx.lineWidth = 16; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.arc(gx, gy, R + 16, rad(-200), rad(60)); ctx.stroke();
  ctx.lineWidth = 9; ctx.strokeStyle = '#e0ab3e';
  ctx.beginPath(); ctx.arc(gx, gy, R + 16, rad(-200), rad(60)); ctx.stroke();
  // sphere
  const sg = ctx.createRadialGradient(gx - 38, gy - 42, 8, gx, gy, R);
  sg.addColorStop(0, '#fff2b0'); sg.addColorStop(0.35, '#f2c24c'); sg.addColorStop(1, '#b77b16');
  ctx.beginPath(); ctx.arc(gx, gy, R, 0, 2 * PI); fillStroke(sg, 6);
  // continents slide slowly as the globe turns
  ctx.save();
  ctx.beginPath(); ctx.arc(gx, gy, R - 3, 0, 2 * PI); ctx.clip();
  ctx.fillStyle = 'rgba(160,100,10,0.75)';
  const off = (t * 22) % 360;
  const blobs = [[-40, -50, 38, 28], [-60, 10, 22, 44], [10, -30, 40, 24], [30, 20, 26, 36], [70, -55, 30, 18], [-5, 70, 30, 14]];
  for (const [bx, by, bw, bh] of blobs) {
    let x = ((bx + off + 180) % 360) - 180;
    const squash = Math.cos((x / R) * 0.9);
    if (squash <= 0.05) continue;
    ctx.beginPath(); ctx.ellipse(gx + Math.sin((x / R) * 0.9) * R, gy + by, bw * squash, bh, 0.3, 0, 2 * PI); ctx.fill();
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(gx - 40, gy - 48, 26, 14, -0.6, 0, 2 * PI);
  ctx.fillStyle = 'rgba(255,255,240,0.55)'; ctx.fill();
  // twinkles
  const tw = (p, s) => Math.max(0, Math.sin(t * s * 2 * PI + p));
  sparkle(gx + 92, gy - 88, 16, 0.3 + 0.7 * tw(0.3, 0.9));
  sparkle(gx - 112, gy + 12, 11, tw(2.1, 1.1));
  sparkle(gx + 118, gy + 70, 13, tw(4.0, 0.8));
  sparkle(gx + 30, gy + 150, 9, tw(1.2, 1.3));
}

// ---------------------------------------------------------------- gloves
const POSES = {
  // extension of [thumb, index, middle, ring, pinky]; fan = even spread, v = peace-sign split
  peace: { f: [0.1, 1, 1, 0.05, 0.05], fan: 0.2, v: 1 },
  open:  { f: [1, 1, 1, 1, 1], fan: 1, v: 0 },
  point: { f: [0.15, 1, 0.05, 0.05, 0.05], fan: 0, v: 0 },
  press: { f: [0.35, 0.95, 0.4, 0.35, 0.3], fan: 0.1, v: 0 },
};
const mixPose = (a, b, k) => ({
  f: a.f.map((v, i) => lerp(v, b.f[i], k)), fan: lerp(a.fan, b.fan, k), v: lerp(a.v, b.v, k),
});

function capsule(x0, y0, x1, y1, w, col) {
  ctx.lineCap = 'round'; ctx.lineWidth = w; ctx.strokeStyle = col;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function palmPath() {
  ctx.beginPath();
  ctx.moveTo(-36, -30);
  ctx.bezierCurveTo(-52, -60, -56, -100, -48, -122);
  ctx.quadraticCurveTo(-32, -144, 0, -142);
  ctx.quadraticCurveTo(34, -144, 50, -122);
  ctx.bezierCurveTo(58, -100, 54, -60, 38, -30);
  ctx.closePath();
}
// Cartoon glove. Origin = wrist, fingers point up at ang 0 (degrees, clockwise).
// Thumb sits on the +x side unless mirrored.
function drawGlove(x, y, ang, u, pose, { mirror = false, back = false } = {}) {
  const O = 5;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rad(ang)); if (mirror) ctx.scale(-1, 1); ctx.scale(u / 100, u / 100);
  const { fan, v } = pose;
  const F = [
    { bx: 30, by: -128, a: 3 + 14 * fan + 8 * v, len: 96, w: 29 },      // index
    { bx: 4, by: -136, a: -3 + 1 * fan - 13 * v, len: 104, w: 30 },     // middle
    { bx: -20, by: -130, a: -9 - 12 * fan - 10 * v, len: 92, w: 28 },   // ring
    { bx: -40, by: -116, a: -16 - 22 * fan - 10 * v, len: 74, w: 25 },  // pinky
  ].map((d, i) => {
    const e = pose.f[i + 1];
    const up = e >= 0.5, L = up ? d.len * (2 * e - 1) : d.len * 0.5 * (1 - 2 * e);
    const a = rad(up ? d.a : 180 + d.a * 0.3);
    return { ...d, up, x1: d.bx + Math.sin(a) * L, y1: d.by - Math.cos(a) * L };
  });
  const te = pose.f[0];
  const ta = rad(lerp(-62, 52, te)), tl = lerp(58, 66, te);
  const T = { bx: 44, by: -62, x1: 44 + Math.sin(ta) * tl, y1: -62 - Math.cos(ta) * tl, up: te >= 0.45 };

  const ext = F.filter(f => f.up);
  // silhouette pass: black, then white on top -> merged outline
  for (const f of ext) capsule(f.bx, f.by, f.x1, f.y1, f.w + 2 * O, INK);
  if (T.up) capsule(T.bx, T.by, T.x1, T.y1, 28 + 2 * O, INK);
  palmPath(); ctx.lineWidth = 2 * O; ctx.strokeStyle = INK; ctx.stroke();
  for (const f of ext) capsule(f.bx, f.by, f.x1, f.y1, f.w, '#ffffff');
  if (T.up) capsule(T.bx, T.by, T.x1, T.y1, 28, '#ffffff');
  const pg = ctx.createLinearGradient(-50, 0, 50, 0);
  pg.addColorStop(0, '#e6e6ea'); pg.addColorStop(0.35, '#ffffff'); pg.addColorStop(1, '#f4f4f6');
  palmPath(); ctx.fillStyle = pg; ctx.fill();
  // finger separation creases
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    if (!(F[i].up && F[i + 1].up)) continue;
    const mx = (F[i].bx + F[i + 1].bx) / 2, my = (F[i].by + F[i + 1].by) / 2;
    ctx.beginPath(); ctx.moveTo(mx, my + 6); ctx.lineTo(mx, my - 10); ctx.stroke();
  }
  if (back) {
    ctx.strokeStyle = 'rgba(24,18,14,0.8)'; ctx.lineWidth = 3.5;
    for (const sx of [-16, 0, 16]) { ctx.beginPath(); ctx.moveTo(sx, -62); ctx.lineTo(sx * 1.15, -100); ctx.stroke(); }
  }
  // curled fingers sit on top of the palm, each with its own outline
  for (const f of F.filter(f => !f.up).reverse()) {
    capsule(f.bx, f.by, f.x1, f.y1 + 4, f.w + 2 * O, INK);
    capsule(f.bx, f.by, f.x1, f.y1 + 4, f.w, '#ffffff');
  }
  if (!T.up) {
    capsule(T.bx, T.by, T.x1, T.y1, 28 + 2 * O, INK);
    capsule(T.bx, T.by, T.x1, T.y1, 28, '#ffffff');
  }
  // rolled cuff
  ctx.beginPath();
  ctx.moveTo(-40, -40); ctx.lineTo(40, -40); ctx.lineTo(50, 6);
  ctx.quadraticCurveTo(0, 16, -50, 6); ctx.closePath();
  fillStroke('#ffffff', O * 1.6);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-43, -24); ctx.quadraticCurveTo(0, -18, 43, -24); ctx.stroke();
  ctx.restore();
}

// noodle arm: shoulder -> wrist, entering the wrist along the hand's axis
function drawArm(S, Wp, ang, lw, pull = 110, kick = [-90, 40]) {
  const ux = Math.sin(rad(ang)), uy = -Math.cos(rad(ang));
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(S.x, S.y);
  ctx.bezierCurveTo(S.x + kick[0], S.y + kick[1], Wp.x - ux * pull, Wp.y - uy * pull, Wp.x, Wp.y);
  ctx.stroke();
}

// ---------------------------------------------------------------- performance (keyed to the voice line)
// "Now picture a man worth a hundred billion dollars."
const KEYS = [
  { t: 0.00, p: 'peace', x: 770, y: 610, a: -8 },
  { t: 0.28, p: 'peace', x: 776, y: 598, a: -4 },
  { t: 0.62, p: 'open',  x: 875, y: 590, a: 22 },   // "picture"
  { t: 1.05, p: 'open',  x: 720, y: 548, a: -32 },  // "a man"
  { t: 1.42, p: 'point', x: 805, y: 520, a: -2 },   // "worth"
  { t: 1.68, p: 'point', x: 800, y: 500, a: 9 },    // "hundred"
  { t: 1.93, p: 'point', x: 808, y: 506, a: -8 },   // "billion"
  { t: 2.22, p: 'open',  x: 752, y: 530, a: -20 },  // "dollars"
  { t: 2.55, p: 'open',  x: 742, y: 540, a: -24 },
  { t: 2.86, p: 'peace', x: 770, y: 600, a: -8 },
  { t: 9.00, p: 'peace', x: 770, y: 600, a: -8 },
];
function handAt(t) {
  let i = 0;
  while (i < KEYS.length - 2 && KEYS[i + 1].t <= t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const k = smooth((t - a.t) / (b.t - a.t));
  const poseK = smooth(clamp((t - a.t) / Math.min(0.26, b.t - a.t)));   // fingers snap a bit faster than the arm
  return {
    x: lerp(a.x, b.x, k) + Math.sin(t * 7.3) * 2,
    y: lerp(a.y, b.y, k) + Math.cos(t * 5.1) * 2,
    a: lerp(a.a, b.a, k),
    pose: mixPose(POSES[a.p], POSES[b.p], poseK),
  };
}
// left hand on the keyboard: a couple of key taps
function tapAt(t) {
  let v = 0;
  for (const tt of [0.35, 1.25, 1.45, 2.45]) v = Math.max(v, Math.exp(-Math.pow((t - tt) / 0.07, 2)));
  return v;
}

// ---------------------------------------------------------------- character layer
const NECK = { x: 1405, y: 560 };
const SLEEVE_L = { x: 1192, y: 770 }, SLEEVE_R = { x: 1650, y: 790 };

function drawChair() {
  ctx.beginPath();
  ctx.moveTo(1108, 900); ctx.lineTo(1108, 470);
  ctx.bezierCurveTo(1108, 360, 1170, 332, 1300, 330);
  ctx.lineTo(1620, 330);
  ctx.bezierCurveTo(1760, 332, 1806, 380, 1806, 480);
  ctx.lineTo(1806, 900); ctx.closePath();
  const g = ctx.createLinearGradient(1108, 0, 1806, 0);
  g.addColorStop(0, '#2a2a2f'); g.addColorStop(0.7, '#34343a'); g.addColorStop(1, '#43403e');
  fillStroke(g, 7);
  ctx.strokeStyle = 'rgba(214,165,80,0.8)'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(1130, 900); ctx.lineTo(1130, 474);
  ctx.bezierCurveTo(1130, 378, 1182, 354, 1300, 352);
  ctx.lineTo(1620, 352);
  ctx.bezierCurveTo(1744, 354, 1784, 392, 1784, 484); ctx.lineTo(1784, 900);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 4;
  for (const sx of [1240, 1560, 1700]) {
    ctx.beginPath(); ctx.moveTo(sx, 372); ctx.quadraticCurveTo(sx + 10, 620, sx, 880); ctx.stroke();
  }
  // right armrest
  ctx.beginPath(); roundRect(1700, 700, 150, 190, 34); fillStroke('#26262b', 7);
  ctx.fillStyle = 'rgba(255,220,160,0.18)'; ctx.fillRect(1716, 712, 118, 8);
}

function drawBody(t, breathe) {
  ctx.save();
  ctx.translate(0, breathe);
  // sleeves go behind the torso outline so the torso edge reads cleanly
  const shirt = '#8e8e92', shade = '#77777c';
  ctx.beginPath();
  poly([[1262, 668], [1206, 690], [1150, 752], [1172, 800], [1232, 784], [1282, 730]], true);
  fillStroke(shirt, 6);
  ctx.beginPath();
  poly([[1560, 662], [1618, 690], [1690, 772], [1652, 822], [1600, 796], [1560, 730]], true);
  fillStroke(shade, 6);
  ctx.beginPath();
  ctx.moveTo(1250, 678);
  ctx.bezierCurveTo(1300, 640, 1360, 626, 1405, 626);
  ctx.bezierCurveTo(1460, 626, 1530, 636, 1580, 670);
  ctx.bezierCurveTo(1620, 740, 1640, 820, 1650, 920);
  ctx.lineTo(1190, 920);
  ctx.bezierCurveTo(1200, 820, 1220, 730, 1250, 678);
  ctx.closePath();
  const g = ctx.createLinearGradient(1190, 0, 1650, 0);
  g.addColorStop(0, '#9a9a9e'); g.addColorStop(0.6, shirt); g.addColorStop(1, shade);
  fillStroke(g, 6);
  ctx.strokeStyle = 'rgba(40,40,45,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(1300, 760); ctx.quadraticCurveTo(1330, 790, 1320, 840); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1520, 740); ctx.quadraticCurveTo(1500, 800, 1530, 860); ctx.stroke();
  // neck + collar
  capsule(NECK.x, NECK.y, NECK.x, 640, 14, INK);
  ctx.beginPath(); ctx.ellipse(1405, 632, 40, 18, 0, 0, PI); fillStroke('#ffffff', 5);
  ctx.restore();
}

const HAIR = [
  [-196, 26], [-236, -30], [-204, -62], [-254, -118], [-190, -142], [-222, -222], [-132, -200],
  [-122, -282], [-52, -218], [4, -300], [44, -222], [118, -284], [128, -206], [206, -246],
  [184, -162], [256, -150], [208, -92], [250, -44], [204, -10], [226, 44], [196, 40],
  [178, -4], [160, -66], [128, -46], [102, -104], [58, -76], [16, -118], [-24, -72],
  [-66, -118], [-104, -74], [-140, -112], [-170, -58], [-190, -86], [-202, -20],
];

function drawHead(t, m, blink, brow, tilt, bob) {
  ctx.save();
  ctx.translate(NECK.x, NECK.y + bob);
  ctx.rotate(rad(tilt));
  ctx.translate(HEAD.x - NECK.x, HEAD.y - NECK.y);
  // head
  ctx.beginPath(); ctx.ellipse(0, 0, 205, 192, 0, 0, 2 * PI);
  const hg = ctx.createRadialGradient(-40, -30, 40, 0, 0, 215);
  hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.8, '#f7f5f2'); hg.addColorStop(1, '#e4e0dc');
  fillStroke(hg, 7);
  // hair
  poly(HAIR, false);
  fillStroke('#141212', 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-110, -190); ctx.quadraticCurveTo(-40, -236, 40, -206); ctx.stroke();

  // eyes: smug, half-lidded; blink closes the lid
  for (const [ex, ey, lidTilt] of [[-82, -12, -0.08], [80, -16, 0.1]]) {
    const lid = lerp(ey - 6, ey + 22, blink);
    ctx.save();
    ctx.beginPath(); ctx.rect(ex - 40, lid + (ex < 0 ? 1 : -1) * lidTilt * 40, 80, 80); ctx.clip();
    ctx.beginPath(); ctx.ellipse(ex + 3, ey + 4, 17, 21, 0, 0, 2 * PI); ctx.fillStyle = INK; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ex - 26, lid - lidTilt * 26); ctx.quadraticCurveTo(ex, lid - 3, ex + 26, lid + lidTilt * 26);
    ctx.stroke();
  }
  // brows: right one rides higher (smug), both lift on emphasis
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-120, -54 - brow * 6); ctx.quadraticCurveTo(-84, -66 - brow * 10, -48, -58 - brow * 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(44, -66 - brow * 12); ctx.quadraticCurveTo(80, -80 - brow * 16, 114, -66 - brow * 10); ctx.stroke();

  // mouth
  const L = [-44 + m * 8, 70], R = [62 - m * 6, 56];
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (m < 0.06) {
    ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.quadraticCurveTo(12, 96, R[0], R[1]); ctx.stroke();
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(R[0] - 6, R[1] - 8); ctx.quadraticCurveTo(R[0] + 8, R[1] + 2, R[0] + 4, R[1] + 10); ctx.stroke();
  } else {
    const drop = 10 + 84 * m;
    ctx.beginPath();
    ctx.moveTo(L[0], L[1]);
    ctx.quadraticCurveTo(10, 78 - 6 * m, R[0], R[1]);
    ctx.quadraticCurveTo(14, 84 + drop * 1.25, L[0], L[1]);
    ctx.closePath();
    ctx.fillStyle = '#5b1b1b'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#e07468';
    ctx.beginPath(); ctx.ellipse(12, 78 + drop * 0.9, 34, 16 + 8 * m, 0, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.quadraticCurveTo(10, 78 - 6 * m, R[0], R[1]);
    ctx.lineTo(R[0], R[1] + 9); ctx.quadraticCurveTo(10, 88 - 6 * m, L[0], L[1] + 9); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- near layer: desk + keyboard
function drawFrontDesk() {
  const y0 = 850;
  const g = ctx.createLinearGradient(0, y0, 0, 1300);
  g.addColorStop(0, '#5e3a1f'); g.addColorStop(1, '#321d0e');
  ctx.fillStyle = g; ctx.fillRect(-800, y0, 3600, 700);
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 3;
  for (const gy of [930, 1010, 1120, 1250]) {
    ctx.beginPath(); ctx.moveTo(-800, gy); ctx.bezierCurveTo(200, gy - 12, 1200, gy + 14, 2800, gy - 6); ctx.stroke();
  }
  ctx.fillStyle = INK; ctx.fillRect(-800, y0 - 7, 3600, 18);
  ctx.fillStyle = '#d6a042'; ctx.fillRect(-800, y0 - 4, 3600, 9);
  ctx.fillStyle = '#f6d582'; ctx.fillRect(-800, y0 - 4, 3600, 3);
  // light spill from the window
  const sp = ctx.createRadialGradient(1700, 900, 30, 1700, 900, 900);
  sp.addColorStop(0, 'rgba(255,210,140,0.25)'); sp.addColorStop(1, 'rgba(255,210,140,0)');
  ctx.fillStyle = sp; ctx.fillRect(400, y0, 2400, 700);
  // keyboard
  const top = 890, bot = 1010, xl0 = 360, xr0 = 1640, xl1 = 300, xr1 = 1700;
  ctx.beginPath();
  ctx.moveTo(xl0, top); ctx.lineTo(xr0, top); ctx.lineTo(xr1, bot); ctx.lineTo(xl1, bot); ctx.closePath();
  fillStroke('#1f1f23', 7);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(xl1 + 10, bot - 2, xr1 - xl1 - 20, 10);
  const rows = 4, cols = 20;
  for (let r = 0; r < rows; r++) {
    const ya = top + 12 + r * 28, yb = ya + 22;
    const k0 = (ya - top) / (bot - top), k1 = (yb - top) / (bot - top);
    const la = lerp(xl0, xl1, k0) + 16, ra = lerp(xr0, xr1, k0) - 16;
    const lb = lerp(xl0, xl1, k1) + 16, rb = lerp(xr0, xr1, k1) - 16;
    const keys = r === 3 ? [[0, 2], [2, 3], [3, 4], [4, 13], [13, 14], [14, 16], [16, 18], [18, 20]]
      : Array.from({ length: cols }, (_, c) => [c, c + 1]);
    for (const [c0, c1] of keys) {
      const f0 = c0 / cols + 0.004, f1 = c1 / cols - 0.004;
      ctx.beginPath();
      ctx.moveTo(lerp(la, ra, f0), ya); ctx.lineTo(lerp(la, ra, f1), ya);
      ctx.lineTo(lerp(lb, rb, f1), yb); ctx.lineTo(lerp(lb, rb, f0), yb); ctx.closePath();
      ctx.fillStyle = '#3a3a41'; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(lerp(la, ra, f0) + 2, ya + 1, (ra - la) * (f1 - f0) - 4, 3);
    }
  }
}

// ---------------------------------------------------------------- atmosphere
function drawDust(t) {
  const r = rng(99);
  for (let i = 0; i < 46; i++) {
    const bx = 700 + r() * 1500, by = r() * 1000, sz = 1.5 + r() * 3.5, ph = r() * 10, sp = 8 + r() * 14;
    const x = bx + Math.sin(t * 0.7 + ph) * 18;
    const y = ((by - t * sp) % 1100 + 1100) % 1100 - 40;
    const a = 0.25 + 0.35 * Math.sin(t * 1.3 + ph * 2) ** 2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, sz * 3);
    g.addColorStop(0, `rgba(255,244,210,${a})`); g.addColorStop(1, 'rgba(255,244,210,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, sz * 3, 0, 2 * PI); ctx.fill();
  }
}
function drawGrade() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // soft window beams
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const [x0, w, a] of [[1900, 260, 0.07], [2150, 200, 0.05], [1650, 140, 0.05]]) {
    const g = ctx.createLinearGradient(x0, 0, x0 - 900, 1080);
    g.addColorStop(0, `rgba(255,220,160,${a})`); g.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x0, -10); ctx.lineTo(x0 + w, -10); ctx.lineTo(x0 + w - 1000, 1090); ctx.lineTo(x0 - 1000, 1090); ctx.fill();
  }
  ctx.restore();
  const v = ctx.createRadialGradient(C.x, C.y, 380, C.x, C.y, 1150);
  v.addColorStop(0, 'rgba(30,14,4,0)'); v.addColorStop(1, 'rgba(30,14,4,0.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------- frame
window.renderFrame = function (t) {
  const cam = camera(t);
  const m = mouthAt(t);
  const hand = handAt(t);
  const tap = tapAt(t);
  const breathe = Math.sin(t * 2.3) * 2.5;
  const blink = Math.max(0, 1 - Math.abs(t - 2.02) / 0.07);
  const emph = smooth((t - 1.4) / 0.25) * (1 - smooth((t - 2.35) / 0.3));
  const brow = 0.25 + 0.75 * emph + 0.25 * m;
  const tilt = -2.5 + Math.sin(t * 1.6) * 1.5 + (hand.x - 780) * 0.02 + emph * 3;
  const bob = -m * 5 + breathe;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  useLayer(cam, DEPTH.wall); drawWall();
  useLayer(cam, DEPTH.back); drawBackDesk(t);

  const cx = useLayer(cam, DEPTH.char);
  drawChair();
  drawBody(t, breathe);
  drawHead(t, m, blink, brow, tilt, bob);
  const sL = { x: SLEEVE_L.x, y: SLEEVE_L.y + breathe };
  drawArm(sL, hand, hand.a, 17, 120, [-100, 30]);
  drawGlove(hand.x, hand.y, hand.a, 160, hand.pose);

  // keyboard hand lives on the desk layer; the noodle arm stretches between layers
  const fx = useLayer(cam, DEPTH.front);
  drawFrontDesk();
  const kw = { x: 1520, y: 880 + tap * 6 }, ka = -108 + tap * 6;
  const S = project(cx, { x: SLEEVE_R.x, y: SLEEVE_R.y + breathe }), Wr = project(fx, kw);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawArm(S, Wr, ka, 17 * cx.s, 50 * fx.s, [30 * cx.s, 40 * cx.s]);
  useLayer(cam, DEPTH.front);
  drawGlove(kw.x, kw.y, ka, 124, mixPose(POSES.press, POSES.point, tap * 0.6), { mirror: true, back: true });

  useLayer(cam, DEPTH.dust); drawDust(t);
  drawGrade();
};

const q = new URLSearchParams(location.search);
if (q.has('t')) renderFrame(parseFloat(q.get('t')));
</script>
</body>
</html>
